    <!-- Fonts start downloading as early as possible, without blocking the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;700;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;700;900&display=swap" /></noscript>

    <!-- The loader below is plain HTML and CSS, so a slow connection sees something at once, before any
         JavaScript has arrived. React replaces everything inside #root when it starts. -->
    <style>
      html, body { margin: 0; background: #F5F0E8; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #0D0D0D; font: 700 2.4rem/1 "Bebas Neue", Impact, "Arial Narrow", sans-serif; letter-spacing: .08em; }
      .boot b { color: #E8250E; font-weight: inherit; }
      .boot i { display: block; width: 120px; height: 3px; background: rgba(13, 13, 13, .12); overflow: hidden; position: relative; }
      .boot i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: #E8250E; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot i::after { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading the portfolio"><span>AARYAN<b>.</b></span><i></i></div></div>
    <noscript>This portfolio needs JavaScript. You can find my work at github.com/AaryanBasnet.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
